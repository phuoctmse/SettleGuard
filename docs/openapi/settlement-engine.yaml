openapi: 3.1.0
info:
  title: Settlement Engine API
  version: 1.0.0
  description: The Settlement Engine handles evaluating and scoring transactions for risk, placing holds on risky transactions, and aggregating settled transactions into settlements.
servers:
  - url: http://localhost:8000/settlement
    description: >-
      Through the gateway. This is how a client business reaches the service:
      every operation below needs a valid API key, and the /settlement prefix is
      stripped before the request is forwarded.
  - url: http://localhost:8082
    description: >-
      The service port, direct. Local development only. Nothing is enforced
      here - no API key, no rate limit - so this port must not be reachable
      from outside the deployment.
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: checkHealth
      summary: Health Check
      description: Returns the health status of the service.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /transactions:
    get:
      operationId: listTransactions
      summary: List Transactions
      description: Lists transactions filtered by a specific status. Currently only used for querying held transactions.
      parameters:
        - name: status
          in: query
          required: true
          description: The status to filter transactions by (e.g., held).
          schema:
            type: string
      responses:
        '200':
          description: A list of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          description: Missing status query param
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /transactions/{id}:
    get:
      operationId: getTransaction
      summary: Get Transaction
      description: Retrieves a transaction by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the transaction.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid transaction id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /transactions/{id}/approve:
    post:
      operationId: approveTransaction
      summary: Approve Transaction
      description: Approves a transaction that is currently in 'held' status.
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the transaction to approve.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid transaction id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction is not held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /transactions/{id}/reject:
    post:
      operationId: rejectTransaction
      summary: Reject Transaction
      description: Rejects a transaction that is currently in 'held' status.
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the transaction to reject.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid transaction id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transaction is not held
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /settlements:
    get:
      operationId: listSettlements
      summary: List Settlements
      description: Lists all settlements.
      responses:
        '200':
          description: A list of settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /settlements/{id}:
    get:
      operationId: getSettlement
      summary: Get Settlement
      description: Retrieves a settlement by its ID.
      parameters:
        - name: id
          in: path
          required: true
          description: The UUID of the settlement.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The settlement details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          description: Invalid settlement id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Settlement not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: >-
        An API key issued to a client business, sent as
        `Authorization: Bearer sg_live_...`. Issued with the gateway's
        `adminctl` CLI; the gateway stores only its SHA-256. Verified by the
        gateway alone - the service itself does not read this header, so a
        request made straight to the service port is served without it.
  responses:
    Unauthorized:
      description: >-
        The API key is missing, malformed, unknown or revoked. Returned by the
        gateway; the request never reaches the service. The four cases are
        deliberately indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The gateway's per-client or per-IP rate limit was exceeded. Returned by
        the gateway; the request never reaches the service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
          example: transaction not found
      required:
        - error
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        account_ids:
          type: array
          items:
            type: string
            format: uuid
          example: ["123e4567-e89b-12d3-a456-426614174001", "123e4567-e89b-12d3-a456-426614174002"]
        amount:
          type: integer
          format: int64
          description: Amount in VND dong (integer, not cents)
          example: 15000000
        score:
          type: integer
          example: 85
        decision:
          type: string
          enum: [pass, hold]
          example: pass
        status:
          type: string
          enum: [pending_settlement, held, settled, rejected]
          example: pending_settlement
        triggered_rules:
          type: array
          items:
            type: string
          example: ["high_velocity"]
        scored_at:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56.000Z"
      required:
        - id
        - account_ids
        - amount
        - score
        - decision
        - status
        - triggered_rules
        - scored_at
    Settlement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        transaction_ids:
          type: array
          items:
            type: string
            format: uuid
          example: ["123e4567-e89b-12d3-a456-426614174001", "123e4567-e89b-12d3-a456-426614174002"]
        transaction_count:
          type: integer
          example: 2
        total_amount:
          type: integer
          format: int64
          description: Amount in VND dong (integer, not cents)
          example: 30000000
        created_at:
          type: string
          format: date-time
          example: "2023-10-01T12:34:56.000Z"
      required:
        - id
        - transaction_ids
        - transaction_count
        - total_amount
        - created_at
