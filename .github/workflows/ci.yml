name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as go.mod's golang-migrate dependency; notification-service
  # shells out to this CLI for its migrations (startup and tests).
  MIGRATE_VERSION: v4.19.1
  # .golangci.yml is v1 config. Installed with `go install` so the binary is
  # built by the same Go toolchain as the modules (the prebuilt v1.64.8
  # release is built with an older Go and refuses go 1.26 modules).
  GOLANGCI_LINT_VERSION: v1.64.8

jobs:
  go-test:
    name: go-test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger-service, accounts-service, settlement-engine, gateway]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          golangci-lint run --config "${GITHUB_WORKSPACE}/.golangci.yml" ./...
      - name: go test
        # -p 1: packages each start their own Postgres/NATS testcontainers;
        # running them in parallel contends for Docker.
        run: go test -count=1 -p 1 ./...

  python-test:
    name: python-test (notification-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/notification-service/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/ledger-service/go.mod
          cache-dependency-path: services/*/go.sum
      - name: Install migrate CLI
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -v

  mobile-test:
    name: mobile-test (mobile-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Jest
        run: npm test -- --ci

  e2e-api:
    name: e2e-api (tests/api)
    runs-on: ubuntu-latest
    env:
      NATS_URL: nats://localhost:4222
      LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/start-stack
      - name: pytest tests/api
        working-directory: tests
        run: python -m pytest api -v
      - name: Collect infra logs
        if: failure()
        run: |
          mkdir -p "$LOG_DIR"
          docker compose -f infra/docker/docker-compose.yml logs --no-color > "$LOG_DIR/docker-compose.log" 2>&1 || true
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-service-logs
          path: e2e-logs/
          if-no-files-found: warn

  security:
    name: security (pytest pentest + ZAP)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NATS_URL: nats://localhost:4222
      LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/start-stack
      - name: pytest tests/security
        working-directory: tests
        run: python -m pytest security -v -rxX --junitxml=../security-junit.xml
      - name: ZAP API scan
        run: |
          set -o pipefail
          bash tests/security/zap/run_zap.sh | tee zap-summary.md
      - name: pytest tests/security (destructive, last)
        # Runs after ZAP on purpose: the destructive test (deselected by
        # addopts above) must not disturb the scan.
        working-directory: tests
        run: python -m pytest security -m destructive -v -rxX --junitxml=../security-destructive-junit.xml
      - name: ZAP summary
        if: always()
        run: '[ -f zap-summary.md ] && sed -n "/^## ZAP API scan/,\$p" zap-summary.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: |
            security-junit.xml
            security-destructive-junit.xml
            tests/security/zap/out/*.html
            tests/security/zap/out/*.json
            tests/security/zap/out/*.log
          if-no-files-found: warn
      - name: Collect infra logs
        if: failure()
        run: |
          mkdir -p "$LOG_DIR"
          docker compose -f infra/docker/docker-compose.yml logs --no-color > "$LOG_DIR/docker-compose.log" 2>&1 || true
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: security-service-logs
          path: e2e-logs/
          if-no-files-found: warn

  e2e-web:
    name: e2e-web (Playwright on the web build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATS_URL: nats://localhost:4222
      LOG_DIR: ${{ github.workspace }}/e2e-logs
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/start-stack
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Build the web app against the gateway
        working-directory: mobile-app
        env:
          EXPO_PUBLIC_ACCOUNTS_API_URL: http://localhost:8000/accounts
          EXPO_PUBLIC_LEDGER_API_URL: http://localhost:8000/ledger
          EXPO_PUBLIC_SETTLEMENT_API_URL: http://localhost:8000/settlement
          EXPO_PUBLIC_NOTIFICATION_API_URL: http://localhost:8000/notifications
        run: |
          npm ci
          npx expo export --platform web --output-dir "$RUNNER_TEMP/web"
      - name: Serve the web app on :8090
        run: |
          mkdir -p "$LOG_DIR"
          nohup python -m http.server 8090 -d "$RUNNER_TEMP/web" > "$LOG_DIR/web.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8090/ && exit 0
            sleep 1
          done
          echo "web app never served"; exit 1
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: pytest tests/e2e
        working-directory: tests
        run: >
          python -m pytest e2e -v --browser chromium
          --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure
          --output test-results --html=e2e-report.html --self-contained-html
      - name: Upload E2E report, traces and videos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-web-report
          path: |
            tests/e2e-report.html
            tests/test-results/
          if-no-files-found: warn
      - name: Collect infra logs
        if: failure()
        run: |
          mkdir -p "$LOG_DIR"
          docker compose -f infra/docker/docker-compose.yml logs --no-color > "$LOG_DIR/docker-compose.log" 2>&1 || true
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-web-service-logs
          path: e2e-logs/
          if-no-files-found: warn
