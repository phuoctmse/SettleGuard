run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/phuoctmse/settleguard
  revive:
    rules:
      - name: var-naming
      - name: error-naming
      - name: exported
